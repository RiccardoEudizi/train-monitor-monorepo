name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: web (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Build
        run: pnpm --filter web build
        env:
          # Build-time placeholder; the app reads the real DATABASE_URL at runtime.
          DATABASE_URL: postgresql://user:password@localhost:5432/ci

  poller:
    name: poller (vet + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/poller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/poller/go.sum

      - run: go vet ./...
      - run: go build ./...
      # DB-gated tests skip themselves when DATABASE_URL is unset.
      - run: go test ./...
